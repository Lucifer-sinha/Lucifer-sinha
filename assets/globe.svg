<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
    <defs>
        <radialGradient id="globe-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.15" />
            <stop offset="70%" stop-color="#00F5FF" stop-opacity="0.05" />
            <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
        </radialGradient>
        <style>
            .meridian {
                transform-origin: 200px 200px;
                animation: spin 12s linear infinite;
                fill: none;
                stroke: #00F5FF;
                stroke-width: 0.8;
                opacity: 0.4;
            }
            .m1 { animation-delay: 0s; }
            .m2 { animation-delay: -1.5s; }
            .m3 { animation-delay: -3s; }
            .m4 { animation-delay: -4.5s; }
            .m5 { animation-delay: -6s; }
            .m6 { animation-delay: -7.5s; }
            .m7 { animation-delay: -9s; }
            .m8 { animation-delay: -10.5s; }
            
            @keyframes spin {
                0% { transform: rotateY(0deg); }
                100% { transform: rotateY(360deg); }
            }

            .lat {
                fill: none;
                stroke: #00F5FF;
                stroke-width: 0.8;
                opacity: 0.4;
            }

            .outline {
                fill: none;
                stroke: #00F5FF;
                stroke-width: 1.5;
                opacity: 0.6;
            }
            
            .star {
                fill: #FFF;
            }
            
            .india-group {
                animation: dotX 12s ease-in-out infinite, dotOpacity 12s linear infinite;
                animation-delay: -3s;
            }
            
            @keyframes dotX {
                0% { transform: translateX(140.7px); }
                50% { transform: translateX(-140.7px); }
                100% { transform: translateX(140.7px); }
            }
            
            @keyframes dotOpacity {
                0%, 49.9% { opacity: 1; }
                50%, 99.9% { opacity: 0; }
                100% { opacity: 1; }
            }
            
            .label-text {
                font-family: monospace;
                font-size: 10px;
                fill: #7D8590;
                letter-spacing: 1px;
            }
            
            @keyframes twinkle {
                0%, 100% { opacity: 0.2; }
                50% { opacity: 0.8; }
            }
        </style>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#0D1117" />
    
    <!-- Stars -->
    <g class="stars">
        <circle cx="50" cy="80" r="1" class="star" style="animation: twinkle 3s infinite -1s;" />
        <circle cx="120" cy="30" r="1.5" class="star" style="animation: twinkle 4s infinite -2s;" />
        <circle cx="350" cy="60" r="1" class="star" style="animation: twinkle 5s infinite -0s;" />
        <circle cx="300" cy="150" r="0.8" class="star" style="animation: twinkle 2.5s infinite -1.5s;" />
        <circle cx="80" cy="250" r="1.2" class="star" style="animation: twinkle 6s infinite -3s;" />
        <circle cx="40" cy="320" r="1" class="star" style="animation: twinkle 3.5s infinite -0.5s;" />
        <circle cx="180" cy="370" r="1.5" class="star" style="animation: twinkle 4.5s infinite -2.5s;" />
        <circle cx="360" cy="280" r="1" class="star" style="animation: twinkle 3s infinite -1s;" />
        <circle cx="320" cy="360" r="1.2" class="star" style="animation: twinkle 5s infinite -4s;" />
        <circle cx="250" cy="40" r="0.8" class="star" style="animation: twinkle 4s infinite -1s;" />
        <circle cx="90" cy="120" r="1" class="star" style="animation: twinkle 3s infinite -2s;" />
        <circle cx="20" cy="180" r="1.5" class="star" style="animation: twinkle 5.5s infinite -3s;" />
        <circle cx="380" cy="190" r="1" class="star" style="animation: twinkle 4s infinite -0.5s;" />
        <circle cx="280" cy="90" r="1.2" class="star" style="animation: twinkle 3.5s infinite -2.5s;" />
        <circle cx="150" cy="320" r="0.8" class="star" style="animation: twinkle 6s infinite -1s;" />
    </g>

    <!-- Globe Glow -->
    <circle cx="200" cy="200" r="180" fill="url(#globe-glow)" />

    <!-- Latitudes -->
    <g class="latitudes">
        <ellipse cx="200" cy="80" rx="90" ry="15" class="lat" />
        <ellipse cx="200" cy="120" rx="127" ry="21" class="lat" />
        <ellipse cx="200" cy="160" rx="145" ry="24" class="lat" />
        <ellipse cx="200" cy="200" rx="150" ry="25" class="lat" />
        <ellipse cx="200" cy="240" rx="145" ry="24" class="lat" />
        <ellipse cx="200" cy="280" rx="127" ry="21" class="lat" />
        <ellipse cx="200" cy="320" rx="90" ry="15" class="lat" />
    </g>

    <!-- Meridians -->
    <g class="meridians-wrap">
        <circle cx="200" cy="200" r="150" class="meridian m1" />
        <circle cx="200" cy="200" r="150" class="meridian m2" />
        <circle cx="200" cy="200" r="150" class="meridian m3" />
        <circle cx="200" cy="200" r="150" class="meridian m4" />
        <circle cx="200" cy="200" r="150" class="meridian m5" />
        <circle cx="200" cy="200" r="150" class="meridian m6" />
        <circle cx="200" cy="200" r="150" class="meridian m7" />
        <circle cx="200" cy="200" r="150" class="meridian m8" />
    </g>

    <!-- Outline -->
    <circle cx="200" cy="200" r="150" class="outline" />

    <!-- India Marker -->
    <g class="india-group">
        <circle cx="200" cy="148" r="8" fill="#FF006E" opacity="0.5">
            <animate attributeName="r" values="5;10;5" dur="2s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" />
        </circle>
        <circle cx="200" cy="148" r="4" fill="#FF006E" />
        <text x="212" y="152" fill="#E6EDF3" font-family="monospace" font-size="10" font-weight="bold">INDIA 🇮🇳</text>
    </g>

    <!-- Label -->
    <text x="200" y="380" class="label-text" text-anchor="middle">LOCATION: EARTH // SECTOR: INDIA</text>
</svg>
