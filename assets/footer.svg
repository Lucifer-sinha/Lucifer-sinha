<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <style>
    .w1 { animation: wave 12s linear infinite; }
    .w2 { animation: wave 18s linear infinite; }
    .w3 { animation: wave 9s linear infinite; }
    @keyframes wave {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1200px); }
    }
    .text-dim { font-family: monospace; font-size: 14px; fill: #7D8590; text-anchor: middle; }
    .text-flow { font-family: monospace; font-size: 16px; font-weight: bold; text-anchor: middle; }
    .arr { fill: #7D8590; font-size: 14px; font-weight: normal; }
    
    .c1 { fill: #00F5FF; animation: glow 3s ease-in-out infinite; animation-delay: 0s; }
    .c2 { fill: #8B5CF6; animation: glow 3s ease-in-out infinite; animation-delay: 0.5s; }
    .c3 { fill: #FF006E; animation: glow 3s ease-in-out infinite; animation-delay: 1s; }
    .c4 { fill: #00FF41; animation: glow 3s ease-in-out infinite; animation-delay: 1.5s; }
    .c5 { fill: #FFD700; animation: glow 3s ease-in-out infinite; animation-delay: 2s; }
    .c6 { fill: #E6EDF3; animation: glow 3s ease-in-out infinite; animation-delay: 2.5s; }
    
    @keyframes glow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; text-shadow: 0 0 8px currentColor; }
    }
  </style>

  <rect width="1200" height="200" fill="#0D1117" />
  
  <!-- Wave top -->
  <g opacity="0.8">
    <path class="w1" fill="#00F5FF" opacity="0.3" d="M 0 30 Q 150 50 300 30 T 600 30 T 900 30 T 1200 30 T 1500 30 T 1800 30 T 2100 30 T 2400 30 L 2400 0 L 0 0 Z" />
    <path class="w2" fill="#8B5CF6" opacity="0.2" d="M 0 20 Q 100 0 200 20 T 400 20 T 600 20 T 800 20 T 1000 20 T 1200 20 T 1400 20 T 1600 20 T 1800 20 T 2000 20 T 2200 20 T 2400 20 L 2400 0 L 0 0 Z" />
    <path class="w3" fill="#FF006E" opacity="0.15" d="M 0 40 Q 75 25 150 40 T 300 40 T 450 40 T 600 40 T 750 40 T 900 40 T 1050 40 T 1200 40 T 1350 40 T 1500 40 T 1650 40 T 1800 40 T 1950 40 T 2100 40 T 2250 40 T 2400 40 L 2400 0 L 0 0 Z" />
  </g>

  <!-- Center Text -->
  <text x="600" y="90" class="text-dim">「 Designed with 🧠 + ☕ 」</text>
  
  <!-- Flow Text -->
  <text x="600" y="130" class="text-flow">
    <tspan class="c1">Think</tspan>
    <tspan class="arr" dx="12">➔</tspan>
    <tspan class="c2" dx="12">Build</tspan>
    <tspan class="arr" dx="12">➔</tspan>
    <tspan class="c3" dx="12">Break</tspan>
    <tspan class="arr" dx="12">➔</tspan>
    <tspan class="c4" dx="12">Debug</tspan>
    <tspan class="arr" dx="12">➔</tspan>
    <tspan class="c5" dx="12">Deploy</tspan>
    <tspan class="arr" dx="12">➔</tspan>
    <tspan class="c6" dx="12">Evolve</tspan>
  </text>
  
  <!-- Equalizer -->
  <g transform="translate(557, 155)">
    <rect x="0" y="10" width="4" height="10" rx="2" fill="#00F5FF">
      <animate attributeName="y" values="10; 2; 10" dur="0.8s" repeatCount="indefinite" begin="0s" />
      <animate attributeName="height" values="10; 18; 10" dur="0.8s" repeatCount="indefinite" begin="0s" />
    </rect>
    <rect x="10" y="5" width="4" height="15" rx="2" fill="#8B5CF6">
      <animate attributeName="y" values="5; 0; 5" dur="1.2s" repeatCount="indefinite" begin="0.2s" />
      <animate attributeName="height" values="15; 20; 15" dur="1.2s" repeatCount="indefinite" begin="0.2s" />
    </rect>
    <rect x="20" y="15" width="4" height="5" rx="2" fill="#FF006E">
      <animate attributeName="y" values="15; 5; 15" dur="0.9s" repeatCount="indefinite" begin="0.4s" />
      <animate attributeName="height" values="5; 15; 5" dur="0.9s" repeatCount="indefinite" begin="0.4s" />
    </rect>
    <rect x="30" y="8" width="4" height="12" rx="2" fill="#00FF41">
      <animate attributeName="y" values="8; 2; 8" dur="1.1s" repeatCount="indefinite" begin="0.1s" />
      <animate attributeName="height" values="12; 18; 12" dur="1.1s" repeatCount="indefinite" begin="0.1s" />
    </rect>
    <rect x="40" y="12" width="4" height="8" rx="2" fill="#FFD700">
      <animate attributeName="y" values="12; 4; 12" dur="0.7s" repeatCount="indefinite" begin="0.3s" />
      <animate attributeName="height" values="8; 16; 8" dur="0.7s" repeatCount="indefinite" begin="0.3s" />
    </rect>
    <rect x="50" y="6" width="4" height="14" rx="2" fill="#E6EDF3">
      <animate attributeName="y" values="6; 0; 6" dur="1.3s" repeatCount="indefinite" begin="0.5s" />
      <animate attributeName="height" values="14; 20; 14" dur="1.3s" repeatCount="indefinite" begin="0.5s" />
    </rect>
    <rect x="60" y="14" width="4" height="6" rx="2" fill="#00F5FF">
      <animate attributeName="y" values="14; 4; 14" dur="1.0s" repeatCount="indefinite" begin="0.2s" />
      <animate attributeName="height" values="6; 16; 6" dur="1.0s" repeatCount="indefinite" begin="0.2s" />
    </rect>
    <rect x="70" y="9" width="4" height="11" rx="2" fill="#8B5CF6">
      <animate attributeName="y" values="9; 1; 9" dur="0.9s" repeatCount="indefinite" begin="0.6s" />
      <animate attributeName="height" values="11; 19; 11" dur="0.9s" repeatCount="indefinite" begin="0.6s" />
    </rect>
    <rect x="80" y="11" width="4" height="9" rx="2" fill="#FF006E">
      <animate attributeName="y" values="11; 3; 11" dur="1.1s" repeatCount="indefinite" begin="0.4s" />
      <animate attributeName="height" values="9; 17; 9" dur="1.1s" repeatCount="indefinite" begin="0.4s" />
    </rect>
  </g>
  
  <!-- Decorative Circuits -->
  <g opacity="0.6">
    <path d="M 20 180 L 50 180 L 70 160 L 120 160" fill="none" stroke="#00F5FF" stroke-width="2" />
    <circle cx="120" cy="160" r="3" fill="#0D1117" stroke="#00F5FF" stroke-width="2" />
    <circle cx="20" cy="180" r="2" fill="#00F5FF" />
    
    <path d="M 40 190 L 80 190 L 95 175 L 140 175" fill="none" stroke="#8B5CF6" stroke-width="2" />
    <circle cx="140" cy="175" r="2" fill="#8B5CF6" />
  </g>
  
  <g opacity="0.6">
    <path d="M 1180 180 L 1150 180 L 1130 160 L 1080 160" fill="none" stroke="#FF006E" stroke-width="2" />
    <circle cx="1080" cy="160" r="3" fill="#0D1117" stroke="#FF006E" stroke-width="2" />
    <circle cx="1180" cy="180" r="2" fill="#FF006E" />
    
    <path d="M 1160 190 L 1120 190 L 1105 175 L 1060 175" fill="none" stroke="#FFD700" stroke-width="2" />
    <circle cx="1060" cy="175" r="2" fill="#FFD700" />
  </g>
</svg>
