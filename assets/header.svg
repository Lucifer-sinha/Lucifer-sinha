<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for subtle depth -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </radialGradient>

    <!-- Holographic Text Gradient -->
    <linearGradient id="holoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF;#8B5CF6;#00F5FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#FF006E;#8B5CF6" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF006E">
        <animate attributeName="stop-color" values="#FF006E;#00F5FF;#FF006E" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Hexagonal Pattern -->
    <pattern id="hexPattern" width="40" height="69.28" patternUnits="userSpaceOnUse" patternTransform="scale(0.5)">
      <path d="M40 17.32L20 5.77 0 17.32V40.41L20 51.96 40 40.41Z" fill="none" stroke="#00F5FF" stroke-width="1" stroke-opacity="0.2"/>
      <path d="M20 51.96L0 63.51V86.6L20 98.15 40 86.6V63.51Z" fill="none" stroke="#00F5FF" stroke-width="1" stroke-opacity="0.2"/>
    </pattern>

    <!-- Grid Mask for perspective fading -->
    <linearGradient id="gridMaskGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-opacity="0" stop-color="white"/>
      <stop offset="40%" stop-opacity="0.1" stop-color="white"/>
      <stop offset="100%" stop-opacity="1" stop-color="white"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1200" height="400" fill="url(#gridMaskGradient)" />
    </mask>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
      
      .main-text {
        font-family: 'Courier Prime', 'Courier New', monospace;
        font-weight: 700;
        font-size: 80px;
        fill: url(#holoGradient);
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: 8px;
        filter: url(#glow);
        animation: glitch 3s infinite;
      }
      
      .sub-text {
        font-family: 'Courier Prime', 'Courier New', monospace;
        font-size: 22px;
        fill: #7D8590;
        text-anchor: middle;
        letter-spacing: 2px;
        animation: pulseSub 4s infinite alternate;
      }

      /* Glitch Effect */
      @keyframes glitch {
        0%, 95%, 100% { transform: translate(0, 0); }
        96% { transform: translate(-5px, 2px); }
        97% { transform: translate(5px, -2px); }
        98% { transform: translate(-3px, -1px); }
        99% { transform: translate(3px, 1px); }
      }

      /* Scan Line */
      .scan-line {
        fill: #00F5FF;
        opacity: 0.15;
        animation: scan 4s linear infinite;
      }
      @keyframes scan {
        0% { transform: translateY(-10px); }
        100% { transform: translateY(410px); }
      }

      /* Floating Particles */
      .particle {
        animation: float var(--dur) linear infinite;
      }
      @keyframes float {
        0% { transform: translateY(420px); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateY(-20px); opacity: 0; }
      }

      @keyframes pulseSub {
        0% { opacity: 0.7; }
        100% { opacity: 1; }
      }
      
      .circuit {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawCircuit 10s linear infinite;
      }
      @keyframes drawCircuit {
        0% { stroke-dashoffset: 1000; opacity: 0.1; }
        20% { stroke-dashoffset: 0; opacity: 0.8; }
        80% { stroke-dashoffset: 0; opacity: 0.8; }
        100% { stroke-dashoffset: -1000; opacity: 0.1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGlow)" />
  
  <!-- Hex Mesh -->
  <rect width="1200" height="400" fill="url(#hexPattern)" opacity="0.05" />

  <!-- Perspective Grid -->
  <g mask="url(#gridMask)" stroke="#00F5FF" stroke-width="1" opacity="0.3">
    <!-- Horizontal lines -->
    <line x1="0" y1="250" x2="1200" y2="250" opacity="0.1"/>
    <line x1="0" y1="280" x2="1200" y2="280" opacity="0.2"/>
    <line x1="0" y1="315" x2="1200" y2="315" opacity="0.4"/>
    <line x1="0" y1="360" x2="1200" y2="360" opacity="0.7"/>
    <line x1="0" y1="415" x2="1200" y2="415" opacity="1.0"/>
    
    <!-- Vanishing Point: Center (600, 150) -->
    <line x1="600" y1="150" x2="0" y2="400" />
    <line x1="600" y1="150" x2="150" y2="400" />
    <line x1="600" y1="150" x2="300" y2="400" />
    <line x1="600" y1="150" x2="450" y2="400" />
    <line x1="600" y1="150" x2="600" y2="400" />
    <line x1="600" y1="150" x2="750" y2="400" />
    <line x1="600" y1="150" x2="900" y2="400" />
    <line x1="600" y1="150" x2="1050" y2="400" />
    <line x1="600" y1="150" x2="1200" y2="400" />
  </g>

  <!-- Circuit Traces (Left) -->
  <g fill="none" stroke="#00F5FF" stroke-width="2" class="circuit" opacity="0.4">
    <path d="M 0 100 L 50 100 L 80 130 L 80 200 L 120 240 L 200 240" />
    <circle cx="200" cy="240" r="4" fill="#00F5FF" />
    <path d="M 0 300 L 40 300 L 70 270 L 140 270" />
    <circle cx="140" cy="270" r="3" fill="#00F5FF" />
    <path d="M 10 50 L 60 50 L 90 20" />
    <circle cx="90" cy="20" r="3" fill="#00F5FF" />
  </g>

  <!-- Circuit Traces (Right) -->
  <g fill="none" stroke="#8B5CF6" stroke-width="2" class="circuit" opacity="0.4" style="animation-delay: -5s;">
    <path d="M 1200 150 L 1150 150 L 1100 200 L 1100 280 L 1050 330 L 980 330" />
    <circle cx="980" cy="330" r="4" fill="#8B5CF6" />
    <path d="M 1200 50 L 1160 50 L 1120 90 L 1050 90" />
    <circle cx="1050" cy="90" r="3" fill="#8B5CF6" />
    <path d="M 1180 380 L 1150 380 L 1120 350 L 1080 350" />
    <circle cx="1080" cy="350" r="3" fill="#8B5CF6" />
  </g>

  <!-- Particles -->
  <g>
    <!-- Cyan Particles -->
    <circle class="particle" cx="150" cy="0" r="2" fill="#00F5FF" style="--dur: 15s; animation-delay: -2s;" />
    <circle class="particle" cx="250" cy="0" r="1.5" fill="#00F5FF" style="--dur: 20s; animation-delay: -10s;" />
    <circle class="particle" cx="400" cy="0" r="2.5" fill="#00F5FF" style="--dur: 12s; animation-delay: -5s;" />
    <circle class="particle" cx="550" cy="0" r="1" fill="#00F5FF" style="--dur: 18s; animation-delay: -8s;" />
    <circle class="particle" cx="700" cy="0" r="3" fill="#00F5FF" style="--dur: 14s; animation-delay: -12s;" />
    <circle class="particle" cx="850" cy="0" r="2" fill="#00F5FF" style="--dur: 16s; animation-delay: -3s;" />
    <circle class="particle" cx="1000" cy="0" r="1.5" fill="#00F5FF" style="--dur: 19s; animation-delay: -15s;" />
    <circle class="particle" cx="1100" cy="0" r="2.5" fill="#00F5FF" style="--dur: 13s; animation-delay: -7s;" />
    <circle class="particle" cx="50" cy="0" r="1.5" fill="#00F5FF" style="--dur: 17s; animation-delay: -1s;" />

    <!-- Purple Particles -->
    <circle class="particle" cx="200" cy="0" r="2" fill="#8B5CF6" style="--dur: 16s; animation-delay: -6s;" />
    <circle class="particle" cx="350" cy="0" r="3" fill="#8B5CF6" style="--dur: 11s; animation-delay: -14s;" />
    <circle class="particle" cx="500" cy="0" r="1.5" fill="#8B5CF6" style="--dur: 21s; animation-delay: -2s;" />
    <circle class="particle" cx="650" cy="0" r="2" fill="#8B5CF6" style="--dur: 15s; animation-delay: -9s;" />
    <circle class="particle" cx="800" cy="0" r="2.5" fill="#8B5CF6" style="--dur: 18s; animation-delay: -4s;" />
    <circle class="particle" cx="950" cy="0" r="1" fill="#8B5CF6" style="--dur: 22s; animation-delay: -17s;" />
    <circle class="particle" cx="1050" cy="0" r="3" fill="#8B5CF6" style="--dur: 12s; animation-delay: -11s;" />
    <circle class="particle" cx="1150" cy="0" r="1.5" fill="#8B5CF6" style="--dur: 19s; animation-delay: -8s;" />
    <circle class="particle" cx="100" cy="0" r="2.5" fill="#8B5CF6" style="--dur: 14s; animation-delay: -13s;" />
    
    <!-- Pink Particles -->
    <circle class="particle" cx="300" cy="0" r="1.5" fill="#FF006E" style="--dur: 17s; animation-delay: -7s;" />
    <circle class="particle" cx="900" cy="0" r="2" fill="#FF006E" style="--dur: 15s; animation-delay: -12s;" />
  </g>

  <!-- HUD Corner Brackets -->
  <g stroke="#00F5FF" stroke-width="4" fill="none" opacity="0.6">
    <!-- Top Left -->
    <path d="M 40 100 L 40 40 L 100 40" />
    <rect x="37" y="37" width="6" height="6" fill="#00F5FF" />
    <!-- Bottom Right -->
    <path d="M 1160 300 L 1160 360 L 1100 360" />
    <rect x="1157" y="357" width="6" height="6" fill="#00F5FF" />
  </g>
  
  <g stroke="#FF006E" stroke-width="2" fill="none" opacity="0.4">
    <!-- Top Right -->
    <path d="M 1160 100 L 1160 40 L 1100 40" />
    <!-- Bottom Left -->
    <path d="M 40 300 L 40 360 L 100 360" />
  </g>

  <!-- Main Text -->
  <text x="600" y="180" class="main-text">ANSH GAUR</text>
  
  <!-- Subtext -->
  <text x="600" y="240" class="sub-text">&lt; Software Engineer / AI Architect / Full-Stack Developer /&gt;</text>

  <!-- Scan Line -->
  <rect x="0" y="0" width="1200" height="10" class="scan-line" />
  <rect x="0" y="5" width="1200" height="1" fill="#00F5FF" opacity="0.5" class="scan-line" />
  
</svg>
