<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </radialGradient>
    <style>
      .bg { fill: #0D1117; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      .sun {
        animation: pulse 3s ease-in-out infinite;
        transform-origin: center;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes unspin {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      .orbit-group {
        animation: spin linear infinite;
        transform-origin: 0 0;
      }
      .unspin-group {
        animation: unspin linear infinite;
        transform-origin: 0 0;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        user-select: none;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <!-- Title -->
  <text x="40" y="50" fill="#7D8590" font-family="monospace" font-size="18" font-weight="bold" letter-spacing="3">TECH ORBIT</text>

  <!-- Stars Generation -->
  <circle cx="120" cy="80" r="1.5" fill="#fff" opacity="0.3" />
  <circle cx="850" cy="420" r="1.2" fill="#fff" opacity="0.4" />
  <circle cx="1100" cy="150" r="0.8" fill="#fff" opacity="0.2" />
  <circle cx="340" cy="300" r="1.0" fill="#fff" opacity="0.5" />
  <circle cx="950" cy="90" r="1.5" fill="#fff" opacity="0.1" />
  <circle cx="50" cy="400" r="0.7" fill="#fff" opacity="0.3" />
  <circle cx="450" cy="50" r="1.2" fill="#fff" opacity="0.4" />
  <circle cx="700" cy="380" r="0.9" fill="#fff" opacity="0.2" />
  <circle cx="1020" cy="280" r="1.4" fill="#fff" opacity="0.5" />
  <circle cx="210" cy="190" r="1.1" fill="#fff" opacity="0.3" />
  <circle cx="610" cy="110" r="0.6" fill="#fff" opacity="0.4" />
  <circle cx="890" cy="20" r="1.3" fill="#fff" opacity="0.2" />
  <circle cx="1150" cy="460" r="1.0" fill="#fff" opacity="0.5" />
  <circle cx="280" cy="450" r="1.5" fill="#fff" opacity="0.1" />
  <circle cx="760" cy="230" r="0.8" fill="#fff" opacity="0.3" />
  <circle cx="150" cy="250" r="1.2" fill="#fff" opacity="0.4" />
  <circle cx="520" cy="410" r="0.9" fill="#fff" opacity="0.2" />
  <circle cx="980" cy="350" r="1.4" fill="#fff" opacity="0.5" />
  <circle cx="400" cy="150" r="1.1" fill="#fff" opacity="0.3" />
  <circle cx="810" cy="140" r="0.6" fill="#fff" opacity="0.4" />
  <circle cx="1080" cy="50" r="1.3" fill="#fff" opacity="0.2" />
  <circle cx="60" cy="200" r="1.0" fill="#fff" opacity="0.5" />
  <circle cx="310" cy="70" r="1.5" fill="#fff" opacity="0.1" />
  <circle cx="660" cy="470" r="0.8" fill="#fff" opacity="0.3" />
  <circle cx="920" cy="260" r="1.2" fill="#fff" opacity="0.4" />
  <circle cx="180" cy="360" r="0.9" fill="#fff" opacity="0.2" />
  <circle cx="550" cy="280" r="1.4" fill="#fff" opacity="0.5" />
  <circle cx="860" cy="170" r="1.1" fill="#fff" opacity="0.3" />
  <circle cx="240" cy="20" r="0.6" fill="#fff" opacity="0.4" />
  <circle cx="730" cy="90" r="1.3" fill="#fff" opacity="0.2" />
  <circle cx="1040" cy="410" r="1.0" fill="#fff" opacity="0.5" />
  <circle cx="110" cy="320" r="1.5" fill="#fff" opacity="0.1" />
  <circle cx="470" cy="220" r="0.8" fill="#fff" opacity="0.3" />
  <circle cx="1180" cy="220" r="1.2" fill="#fff" opacity="0.4" />
  <circle cx="380" cy="390" r="0.9" fill="#fff" opacity="0.2" />

  <!-- Center group for the system -->
  <g transform="translate(600, 250)">
    
    <!-- Scaled container for elliptical orbits -->
    <g transform="scale(1, 0.6)">
      <!-- Orbital Rings -->
      <circle r="80" fill="none" stroke="#00F5FF" stroke-opacity="0.15" stroke-dasharray="4 4" />
      <circle r="140" fill="none" stroke="#00F5FF" stroke-opacity="0.15" stroke-dasharray="4 4" />
      <circle r="200" fill="none" stroke="#00F5FF" stroke-opacity="0.15" stroke-dasharray="4 4" />
      <circle r="270" fill="none" stroke="#00F5FF" stroke-opacity="0.15" stroke-dasharray="4 4" />

      <!-- ORBIT 1 (6s) -->
      <!-- Python (0s) -->
      <g class="orbit-group" style="animation-duration: 6s; animation-delay: 0s;">
        <g transform="translate(80, 0)">
          <g class="unspin-group" style="animation-duration: 6s; animation-delay: 0s;">
            <g transform="scale(1, 1.6666)">
              <circle r="15" fill="#00F5FF" opacity="0.2" />
              <circle r="10" fill="#00F5FF" />
              <text x="17" y="1" dominant-baseline="middle" font-size="11" fill="#00F5FF">Python</text>
            </g>
          </g>
        </g>
      </g>
      <!-- Java (-3s) -->
      <g class="orbit-group" style="animation-duration: 6s; animation-delay: -3s;">
        <g transform="translate(80, 0)">
          <g class="unspin-group" style="animation-duration: 6s; animation-delay: -3s;">
            <g transform="scale(1, 1.6666)">
              <circle r="12" fill="#00F5FF" opacity="0.2" />
              <circle r="8" fill="#00F5FF" />
              <text x="14" y="1" dominant-baseline="middle" font-size="10" fill="#00F5FF">Java</text>
            </g>
          </g>
        </g>
      </g>
      
      <!-- ORBIT 2 (10s) -->
      <!-- Flask (0s) -->
      <g class="orbit-group" style="animation-duration: 10s; animation-delay: 0s;">
        <g transform="translate(140, 0)">
          <g class="unspin-group" style="animation-duration: 10s; animation-delay: 0s;">
            <g transform="scale(1, 1.6666)">
              <circle r="12" fill="#8B5CF6" opacity="0.3" />
              <circle r="8" fill="#8B5CF6" />
              <text x="14" y="1" dominant-baseline="middle" font-size="10" fill="#8B5CF6">Flask</text>
            </g>
          </g>
        </g>
      </g>
      <!-- REST APIs (-5s) -->
      <g class="orbit-group" style="animation-duration: 10s; animation-delay: -5s;">
        <g transform="translate(140, 0)">
          <g class="unspin-group" style="animation-duration: 10s; animation-delay: -5s;">
            <g transform="scale(1, 1.6666)">
              <circle r="11" fill="#8B5CF6" opacity="0.3" />
              <circle r="7" fill="#8B5CF6" />
              <text x="13" y="1" dominant-baseline="middle" font-size="10" fill="#8B5CF6">REST APIs</text>
            </g>
          </g>
        </g>
      </g>

      <!-- ORBIT 3 (14s) -->
      <!-- AWS (0s) -->
      <g class="orbit-group" style="animation-duration: 14s; animation-delay: 0s;">
        <g transform="translate(200, 0)">
          <g class="unspin-group" style="animation-duration: 14s; animation-delay: 0s;">
            <g transform="scale(1, 1.6666)">
              <circle r="13" fill="#FFD700" opacity="0.3" />
              <circle r="9" fill="#FFD700" />
              <text x="15" y="1" dominant-baseline="middle" font-size="10" fill="#FFD700">AWS</text>
            </g>
          </g>
        </g>
      </g>
      <!-- MySQL (-4.66s) -->
      <g class="orbit-group" style="animation-duration: 14s; animation-delay: -4.66s;">
        <g transform="translate(200, 0)">
          <g class="unspin-group" style="animation-duration: 14s; animation-delay: -4.66s;">
            <g transform="scale(1, 1.6666)">
              <circle r="11" fill="#FFD700" opacity="0.3" />
              <circle r="7" fill="#FFD700" />
              <text x="13" y="1" dominant-baseline="middle" font-size="10" fill="#FFD700">MySQL</text>
            </g>
          </g>
        </g>
      </g>
      <!-- Cloudflare (-9.33s) -->
      <g class="orbit-group" style="animation-duration: 14s; animation-delay: -9.33s;">
        <g transform="translate(200, 0)">
          <g class="unspin-group" style="animation-duration: 14s; animation-delay: -9.33s;">
            <g transform="scale(1, 1.6666)">
              <circle r="10" fill="#FFD700" opacity="0.3" />
              <circle r="6" fill="#FFD700" />
              <text x="12" y="1" dominant-baseline="middle" font-size="10" fill="#FFD700">Cloudflare</text>
            </g>
          </g>
        </g>
      </g>

      <!-- ORBIT 4 (18s) -->
      <!-- LLM (0s) -->
      <g class="orbit-group" style="animation-duration: 18s; animation-delay: 0s;">
        <g transform="translate(270, 0)">
          <g class="unspin-group" style="animation-duration: 18s; animation-delay: 0s;">
            <g transform="scale(1, 1.6666)">
              <circle r="12" fill="#FF006E" opacity="0.3" />
              <circle r="8" fill="#FF006E" />
              <text x="14" y="1" dominant-baseline="middle" font-size="10" fill="#FF006E">LLM</text>
            </g>
          </g>
        </g>
      </g>
      <!-- Transformers (-6s) -->
      <g class="orbit-group" style="animation-duration: 18s; animation-delay: -6s;">
        <g transform="translate(270, 0)">
          <g class="unspin-group" style="animation-duration: 18s; animation-delay: -6s;">
            <g transform="scale(1, 1.6666)">
              <circle r="11" fill="#FF006E" opacity="0.3" />
              <circle r="7" fill="#FF006E" />
              <text x="13" y="1" dominant-baseline="middle" font-size="10" fill="#FF006E">Transformers</text>
            </g>
          </g>
        </g>
      </g>
      <!-- RAG (-12s) -->
      <g class="orbit-group" style="animation-duration: 18s; animation-delay: -12s;">
        <g transform="translate(270, 0)">
          <g class="unspin-group" style="animation-duration: 18s; animation-delay: -12s;">
            <g transform="scale(1, 1.6666)">
              <circle r="10" fill="#FF006E" opacity="0.3" />
              <circle r="6" fill="#FF006E" />
              <text x="12" y="1" dominant-baseline="middle" font-size="10" fill="#FF006E">RAG</text>
            </g>
          </g>
        </g>
      </g>
      
    </g>
    
    <!-- Central CORE (outside scaled container to remain circular) -->
    <g class="sun">
      <circle r="45" fill="url(#sun-glow)" opacity="0.25" />
      <circle r="35" fill="url(#sun-glow)" />
    </g>
    <text x="0" y="55" font-family="monospace" font-size="11" fill="#7D8590" text-anchor="middle" font-weight="bold" letter-spacing="2">CORE</text>

  </g>
</svg>
