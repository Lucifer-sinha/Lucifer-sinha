<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%">
  <defs>
    <linearGradient id="pacGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="pacGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ghostGlow1">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pacMove {
      0% { transform: translateX(-60px); }
      100% { transform: translateX(1260px); }
    }
    @keyframes chomp {
      0%, 100% { d: path('M30,60 L30,35 A25,25 0 0,1 55,60 A25,25 0 0,1 30,85 Z'); }
      50% { d: path('M30,60 L55,50 A25,25 0 0,1 55,60 A25,25 0 0,1 55,70 Z'); }
    }
    @keyframes mouthOpen {
      0%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }
    @keyframes ghostFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes ghostChase {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(1300px); }
    }
    @keyframes dotEat {
      0%, 48% { opacity: 1; r: 5; }
      50% { opacity: 0; r: 0; }
      100% { opacity: 0; r: 0; }
    }
    @keyframes powerDotPulse {
      0%, 100% { r: 8; opacity: 0.8; }
      50% { r: 10; opacity: 1; }
    }
    @keyframes eyeLook {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(2px); }
    }
    @keyframes mazeWallPulse {
      0%, 100% { stroke-opacity: 0.15; }
      50% { stroke-opacity: 0.25; }
    }
    .pac-group { animation: pacMove 12s linear infinite; }
    .ghost1 { animation: ghostChase 12s linear infinite; animation-delay: 1.2s; }
    .ghost2 { animation: ghostChase 12s linear infinite; animation-delay: 1.8s; }
    .ghost3 { animation: ghostChase 12s linear infinite; animation-delay: 2.4s; }
    .ghost-body { animation: ghostFloat 0.6s ease-in-out infinite; }
    .maze-wall { animation: mazeWallPulse 3s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="120" fill="#0D1117"/>

  <!-- Maze walls (decorative top and bottom borders) -->
  <line x1="0" y1="15" x2="1200" y2="15" stroke="#00F5FF" stroke-width="2" stroke-dasharray="20,10" class="maze-wall"/>
  <line x1="0" y1="105" x2="1200" y2="105" stroke="#00F5FF" stroke-width="2" stroke-dasharray="20,10" class="maze-wall"/>
  
  <!-- Score display -->
  <text x="30" y="12" font-family="'Courier New', monospace" font-size="9" fill="#FFD700" letter-spacing="1">SCORE</text>
  <text x="80" y="12" font-family="'Courier New', monospace" font-size="9" fill="#FFFFFF" letter-spacing="1">1337</text>
  <text x="1100" y="12" font-family="'Courier New', monospace" font-size="9" fill="#FFD700" letter-spacing="1">HIGH SCORE</text>
  <text x="1095" y="118" font-family="'Courier New', monospace" font-size="9" fill="#FFFFFF" letter-spacing="1">9999</text>

  <!-- Dots (Pac-Man food) - distributed across the path -->
  <circle cx="80" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 0.6s;"/>
  <circle cx="140" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 1.1s;"/>
  <circle cx="200" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 1.5s;"/>
  <circle cx="260" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 2s;"/>
  <!-- Power pellet -->
  <circle cx="320" cy="60" r="8" fill="#FF006E" filter="url(#dotGlow)" style="animation: powerDotPulse 0.8s ease-in-out infinite, dotEat 12s linear infinite; animation-delay: 0s, 2.4s;"/>
  <circle cx="380" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 2.8s;"/>
  <circle cx="440" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 3.2s;"/>
  <circle cx="500" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 3.6s;"/>
  <circle cx="560" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 4s;"/>
  <!-- Power pellet -->
  <circle cx="620" cy="60" r="8" fill="#8B5CF6" filter="url(#dotGlow)" style="animation: powerDotPulse 0.8s ease-in-out infinite, dotEat 12s linear infinite; animation-delay: 0s, 4.4s;"/>
  <circle cx="680" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 4.8s;"/>
  <circle cx="740" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 5.2s;"/>
  <circle cx="800" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 5.6s;"/>
  <circle cx="860" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 6s;"/>
  <!-- Power pellet -->
  <circle cx="920" cy="60" r="8" fill="#00F5FF" filter="url(#dotGlow)" style="animation: powerDotPulse 0.8s ease-in-out infinite, dotEat 12s linear infinite; animation-delay: 0s, 6.4s;"/>
  <circle cx="980" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 6.8s;"/>
  <circle cx="1040" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 7.2s;"/>
  <circle cx="1100" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 7.6s;"/>
  <circle cx="1160" cy="60" r="5" fill="#FFD700" filter="url(#dotGlow)" style="animation: dotEat 12s linear infinite; animation-delay: 8s;"/>

  <!-- Pac-Man -->
  <g class="pac-group" filter="url(#pacGlow)">
    <!-- Pac body - closed mouth -->
    <circle cx="30" cy="60" r="22" fill="url(#pacGrad)"/>
    <!-- Mouth animation overlay -->
    <g style="animation: mouthOpen 0.3s linear infinite;">
      <polygon points="30,60 58,45 58,75" fill="#0D1117"/>
    </g>
    <!-- Eye -->
    <circle cx="34" cy="48" r="3.5" fill="#0D1117"/>
    <circle cx="35" cy="47" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Ghost 1 - Cyan (Inky) -->
  <g class="ghost1" filter="url(#ghostGlow1)">
    <g class="ghost-body">
      <path d="M15,75 L15,52 Q15,35 30,35 Q45,35 45,52 L45,75 L40,68 L35,75 L30,68 L25,75 L20,68 Z" fill="#00F5FF" opacity="0.9"/>
      <circle cx="24" cy="50" r="4" fill="white"/>
      <circle cx="36" cy="50" r="4" fill="white"/>
      <circle cx="25.5" cy="50" r="2" fill="#0D1117"/>
      <circle cx="37.5" cy="50" r="2" fill="#0D1117"/>
    </g>
  </g>

  <!-- Ghost 2 - Pink (Pinky) -->
  <g class="ghost2" filter="url(#ghostGlow1)">
    <g class="ghost-body" style="animation-delay: 0.2s;">
      <path d="M15,75 L15,52 Q15,35 30,35 Q45,35 45,52 L45,75 L40,68 L35,75 L30,68 L25,75 L20,68 Z" fill="#FF006E" opacity="0.9"/>
      <circle cx="24" cy="50" r="4" fill="white"/>
      <circle cx="36" cy="50" r="4" fill="white"/>
      <circle cx="25.5" cy="50" r="2" fill="#0D1117"/>
      <circle cx="37.5" cy="50" r="2" fill="#0D1117"/>
    </g>
  </g>

  <!-- Ghost 3 - Purple (custom) -->
  <g class="ghost3" filter="url(#ghostGlow1)">
    <g class="ghost-body" style="animation-delay: 0.4s;">
      <path d="M15,75 L15,52 Q15,35 30,35 Q45,35 45,52 L45,75 L40,68 L35,75 L30,68 L25,75 L20,68 Z" fill="#8B5CF6" opacity="0.9"/>
      <circle cx="24" cy="50" r="4" fill="white"/>
      <circle cx="36" cy="50" r="4" fill="white"/>
      <circle cx="25.5" cy="50" r="2" fill="#0D1117"/>
      <circle cx="37.5" cy="50" r="2" fill="#0D1117"/>
    </g>
  </g>
</svg>
