<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <style>
      @keyframes fadeInUp {
        0% { transform: translateY(15px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      .node {
        opacity: 0;
        animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .n1 { animation-delay: 0.5s; }
      .n2 { animation-delay: 1.5s; }
      .n3 { animation-delay: 2.5s; }
      .n4 { animation-delay: 3.5s; }
      .n5 { animation-delay: 4.5s; }
      
      .label {
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
        fill: #E6EDF3;
        text-anchor: middle;
        font-weight: bold;
      }
      .sublabel {
        font-family: 'Courier New', Courier, monospace;
        font-size: 12px;
        fill: #7D8590;
        text-anchor: middle;
      }
      .connector {
        stroke: #30363D;
        stroke-width: 2;
        stroke-dasharray: 4 4;
      }
      .hud {
        fill: none;
        stroke: #30363D;
        stroke-width: 2;
      }
      .title {
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
        fill: #7D8590;
        letter-spacing: 2px;
      }
    </style>
    
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1C2128" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#0D1117" />

  <!-- HUD brackets -->
  <path class="hud" d="M 40 60 L 40 40 L 60 40" />
  <path class="hud" d="M 1160 60 L 1160 40 L 1140 40" />
  <path class="hud" d="M 40 340 L 40 360 L 60 360" />
  <path class="hud" d="M 1160 340 L 1160 360 L 1140 360" />

  <!-- Title -->
  <text x="50" y="60" class="title">EVOLUTION PATH</text>

  <!-- Main Timeline Line -->
  <line x1="100" y1="200" x2="1100" y2="200" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Dot markers -->
  <g fill="#30363D">
    <circle cx="100" cy="200" r="2"/><circle cx="140" cy="200" r="2"/><circle cx="180" cy="200" r="2"/><circle cx="220" cy="200" r="2"/><circle cx="260" cy="200" r="2"/><circle cx="300" cy="200" r="2"/><circle cx="340" cy="200" r="2"/><circle cx="380" cy="200" r="2"/><circle cx="420" cy="200" r="2"/><circle cx="460" cy="200" r="2"/><circle cx="500" cy="200" r="2"/><circle cx="540" cy="200" r="2"/><circle cx="580" cy="200" r="2"/><circle cx="620" cy="200" r="2"/><circle cx="660" cy="200" r="2"/><circle cx="700" cy="200" r="2"/><circle cx="740" cy="200" r="2"/><circle cx="780" cy="200" r="2"/><circle cx="820" cy="200" r="2"/><circle cx="860" cy="200" r="2"/><circle cx="900" cy="200" r="2"/><circle cx="940" cy="200" r="2"/><circle cx="980" cy="200" r="2"/><circle cx="1020" cy="200" r="2"/><circle cx="1060" cy="200" r="2"/><circle cx="1100" cy="200" r="2"/>
  </g>

  <!-- Animated Pulse on Line -->
  <circle cx="100" cy="200" r="4" fill="#00F5FF">
    <animate attributeName="cx" values="100;1100" dur="8s" repeatCount="indefinite" />
    <animate attributeName="r" values="3; 6; 3" dur="1s" repeatCount="indefinite" />
  </circle>
  <circle cx="100" cy="200" r="10" fill="none" stroke="#00F5FF" stroke-width="2">
    <animate attributeName="cx" values="100;1100" dur="8s" repeatCount="indefinite" />
    <animate attributeName="r" values="5; 15; 5" dur="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8; 0; 0.8" dur="1s" repeatCount="indefinite" />
  </circle>

  <!-- Node 1: LEARNING -->
  <g class="node n1">
    <line x1="180" y1="200" x2="180" y2="150" class="connector" />
    <line x1="180" y1="200" x2="180" y2="250" class="connector" />
    <text x="180" y="140" class="label">🎓 LEARNING</text>
    <text x="180" y="265" class="sublabel">Python • Java • SQL</text>
    
    <!-- Outer Glow -->
    <circle cx="180" cy="200" r="16" fill="none" stroke="#8B5CF6" stroke-width="2">
      <animate attributeName="r" values="14; 22; 14" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6; 0; 0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- Inner Circle -->
    <circle cx="180" cy="200" r="12" fill="#8B5CF6" />
  </g>

  <!-- Node 2: WEB DEV -->
  <g class="node n2">
    <line x1="380" y1="200" x2="380" y2="150" class="connector" />
    <line x1="380" y1="200" x2="380" y2="250" class="connector" />
    <text x="380" y="140" class="label">🌐 WEB DEV</text>
    <text x="380" y="265" class="sublabel">HTML • CSS • Flask</text>
    
    <circle cx="380" cy="200" r="18" fill="none" stroke="#00F5FF" stroke-width="2">
      <animate attributeName="r" values="16; 26; 16" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6; 0; 0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="380" cy="200" r="14" fill="#00F5FF" />
  </g>

  <!-- Node 3: CLOUD & DATA -->
  <g class="node n3">
    <line x1="580" y1="200" x2="580" y2="150" class="connector" />
    <line x1="580" y1="200" x2="580" y2="250" class="connector" />
    <text x="580" y="140" class="label">☁️ CLOUD &amp; DATA</text>
    <text x="580" y="265" class="sublabel">AWS • MySQL • APIs</text>
    
    <circle cx="580" cy="200" r="18" fill="none" stroke="#FFD700" stroke-width="2">
      <animate attributeName="r" values="16; 26; 16" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6; 0; 0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="580" cy="200" r="14" fill="#FFD700" />
  </g>

  <!-- Node 4: AI/ML -->
  <g class="node n4">
    <line x1="780" y1="200" x2="780" y2="150" class="connector" />
    <line x1="780" y1="200" x2="780" y2="250" class="connector" />
    <text x="780" y="140" class="label">🧠 AI/ML</text>
    <text x="780" y="265" class="sublabel">LLMs • Transformers • RAG</text>
    
    <circle cx="780" cy="200" r="20" fill="none" stroke="#FF006E" stroke-width="2">
      <animate attributeName="r" values="18; 28; 18" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6; 0; 0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="780" cy="200" r="16" fill="#FF006E" />
  </g>

  <!-- Node 5: NOW -->
  <g class="node n5">
    <line x1="1000" y1="200" x2="1000" y2="150" class="connector" />
    <line x1="1000" y1="200" x2="1000" y2="250" class="connector" />
    <text x="1000" y="140" class="label">🚀 NOW</text>
    <text x="1000" y="265" class="sublabel">Building the Future</text>
    
    <!-- Extra prominent glow for the active node -->
    <circle cx="1000" cy="200" r="22" fill="none" stroke="#00FF41" stroke-width="3">
      <animate attributeName="r" values="20; 35; 20" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 0; 0.8" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="200" r="18" fill="#00FF41" />
  </g>

</svg>
